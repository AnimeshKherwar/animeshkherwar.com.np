<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Snake, Escalated — Animesh Kherwar's Lab</title>
  <meta name="theme-color" content="#08090a">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">
  <link rel="stylesheet" href="../../assets/css/lab.css">
  <style>
    .sn { display: grid; grid-template-columns: minmax(0, 560px) minmax(0, 1fr); gap: clamp(20px, 4vw, 44px); align-items: start; }
    .board-wrap { position: relative; width: 100%; aspect-ratio: 1; border-radius: 20px; overflow: hidden; border: 1px solid var(--line-2); background: #060708; touch-action: none; }
    canvas#board { display: block; width: 100%; height: 100%; }
    .overlay { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; background: rgba(6,7,8,.82); backdrop-filter: blur(4px); }
    .overlay.hide { display: none; }
    .overlay h2 { margin: 6px 0; font-size: clamp(30px, 6vw, 46px); letter-spacing: -0.05em; }
    .overlay p { margin: 0 0 18px; color: var(--muted); }
    .hud { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .hud .panel b { display: block; font-size: 30px; letter-spacing: -0.04em; font-weight: 600; }
    .hud .panel span { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .eating { margin-top: 10px; display: flex; align-items: center; gap: 14px; }
    .eating .g { font-size: 40px; width: 64px; height: 64px; display: grid; place-items: center; border-radius: 18px; background: color-mix(in srgb, var(--exp) 12%, transparent); border: 1px solid color-mix(in srgb, var(--exp) 25%, transparent); }
    .eating b { display: block; font-size: 20px; letter-spacing: -0.02em; }
    .eating span { font-size: 13px; color: var(--muted); }
    .menu { margin-top: 14px; display: flex; gap: 6px; flex-wrap: wrap; }
    .menu i { font-style: normal; font-size: 22px; width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; border: 1px solid var(--line); filter: grayscale(1); opacity: .35; transition: all .3s; }
    .menu i.on { filter: none; opacity: 1; border-color: var(--line-2); }
    .menu i.lock { filter: blur(3px) grayscale(1); }
    .keys-hint { margin-top: 16px; font-family: var(--mono); font-size: 12px; color: var(--dim); }
    .dpad { display: none; margin: 16px auto 0; width: 210px; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .dpad button { height: 62px; border-radius: 16px; border: 1px solid var(--line-2); background: rgba(255,255,255,.05); font-size: 22px; cursor: pointer; touch-action: manipulation; }
    .dpad button:active { background: color-mix(in srgb, var(--exp) 30%, transparent); }
    .dpad .u { grid-column: 2; } .dpad .l { grid-column: 1; grid-row: 2; } .dpad .d { grid-column: 2; grid-row: 2; } .dpad .r { grid-column: 3; grid-row: 2; }
    body.is-touch .dpad { display: grid; }
    body.is-touch .keys-hint { display: none; }
    @media (max-width: 820px) {
      .sn { grid-template-columns: 1fr; }
      .side { order: -1; }
      .hud .panel b { font-size: 22px; }
      .eating .g { width: 48px; height: 48px; font-size: 28px; }
      .menu { display: none; }
    }
  </style>
</head>
<body data-root="../../" data-exp="009">
  <div data-lab-header></div>
  <section data-lab-hero></section>

  <main class="wrap">
    <section class="stage">
      <div class="sn">
        <div>
          <div class="board-wrap" id="wrap">
            <canvas id="board"></canvas>
            <div class="overlay" id="overlay">
              <div>
                <div style="font-size:48px">🐍</div>
                <h2 id="ovTitle">Snake, Escalated</h2>
                <p id="ovText">Eat things. The things get worse.</p>
                <button class="btn accent" id="play">Start</button>
              </div>
            </div>
          </div>
          <div class="dpad" id="dpad">
            <button class="u" data-dir="up" aria-label="Up">▲</button>
            <button class="l" data-dir="left" aria-label="Left">◀</button>
            <button class="d" data-dir="down" aria-label="Down">▼</button>
            <button class="r" data-dir="right" aria-label="Right">▶</button>
          </div>
        </div>
        <div class="side">
          <div class="hud">
            <div class="panel"><b id="score">0</b><span>Score</span></div>
            <div class="panel"><b id="hi">0</b><span>Best</span></div>
          </div>
          <div class="panel eating" style="margin-top:10px">
            <div class="g" id="eatG">🍎</div>
            <div><b id="eatN">Apple</b><span id="eatC">A healthy start. It won't last.</span></div>
          </div>
          <div class="menu" id="menu"></div>
          <div class="keys-hint">Arrow keys / WASD to move · Space to pause</div>
        </div>
      </div>
    </section>
  </main>

  <nav data-lab-pager></nav>

  <script src="../../assets/js/registry.js"></script>
  <script src="../../assets/js/lab.js"></script>
  <script src="app.js"></script>
</body>
</html>
