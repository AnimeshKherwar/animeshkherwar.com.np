<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Laboratory OS — Animesh Kherwar's Lab</title>
  <meta name="theme-color" content="#08090a">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">
  <link rel="stylesheet" href="../../assets/css/lab.css">
  <style>
    /* ===== Shell ===== */
    .os {
      position: relative; height: min(78vh, 720px); min-height: 540px; border-radius: 22px; overflow: hidden;
      border: 1px solid var(--line-2); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      background:
        radial-gradient(60% 80% at 15% 20%, rgba(10,132,255,.55), transparent 60%),
        radial-gradient(50% 70% at 85% 30%, rgba(191,90,242,.45), transparent 60%),
        radial-gradient(70% 60% at 50% 100%, rgba(48,209,88,.35), transparent 60%),
        #0b0d12;
      font-size: 14px; color: var(--text, #f5f5f7); transition: background .6s ease;
    }
    .os.full { position: fixed; inset: 0; height: 100dvh; min-height: 0; border-radius: 0; border: 0; z-index: 10000; }
    .os.boring { background: #c0c0c0 !important; filter: grayscale(1); }
    .os.party { animation: party 1.2s linear infinite; }
    @keyframes party { to { filter: hue-rotate(360deg); } }
    .os.calm * { animation-duration: .001s !important; transition-duration: .001s !important; }
    .os button { color: inherit; font: inherit; }

    .desk { position: absolute; inset: 0 0 52px 0; padding: 16px; display: grid; grid-auto-flow: column; grid-template-rows: repeat(auto-fill, 96px); grid-auto-columns: 92px; gap: 6px; align-content: start; }
    .ico { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 4px; border-radius: 12px; cursor: default; text-align: center; border: 1px solid transparent; }
    .ico .g { position: relative; font-size: 34px; line-height: 1; filter: drop-shadow(0 6px 10px rgba(0,0,0,.4)); }
    .ico span { font-size: 12px; line-height: 1.2; text-shadow: 0 1px 3px rgba(0,0,0,.8); word-break: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .ico:hover { background: rgba(255,255,255,.08); }
    .ico.sel { background: rgba(10,132,255,.3); border-color: rgba(10,132,255,.6); }
    .desk.blink .ico { animation: blink .35s; }
    @keyframes blink { 50% { opacity: .2; } }
    .badge { position: absolute; top: -4px; right: -10px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #ff453a; color: #fff; font: 600 11px/18px var(--mono); font-style: normal; }

    /* ===== Taskbar ===== */
    .taskbar {
      position: absolute; left: 0; right: 0; bottom: 0; height: 52px; z-index: 500;
      display: flex; align-items: center; gap: 6px; padding: 0 8px;
      background: rgba(18,20,26,.72); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6);
      border-top: 1px solid rgba(255,255,255,.08);
    }
    .start { height: 38px; padding: 0 14px; border-radius: 10px; border: 0; background: rgba(255,255,255,.08); cursor: pointer; font-weight: 600; display: flex; gap: 8px; align-items: center; flex: none; }
    .start:hover, .start.on { background: rgba(255,255,255,.16); }
    .tasks { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
    .tasks::-webkit-scrollbar { display: none; }
    .task { flex: none; height: 38px; max-width: 170px; padding: 0 12px; border-radius: 10px; border: 0; background: rgba(255,255,255,.05); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; border-bottom: 2px solid transparent; display: flex; gap: 6px; align-items: center; }
    .task .tt { overflow: hidden; text-overflow: ellipsis; }
    .task.active { background: rgba(255,255,255,.14); border-bottom-color: var(--exp, #0a84ff); }
    .tray { display: flex; align-items: center; gap: 2px; flex: none; }
    .tray button { border: 0; background: transparent; height: 38px; min-width: 32px; border-radius: 8px; cursor: pointer; font-size: 14px; }
    .tray button:hover { background: rgba(255,255,255,.1); }
    .clock { font-family: var(--mono); font-size: 12px; color: #cfd3da; padding: 0 8px !important; text-align: right; line-height: 1.3; }

    /* ===== Start menu / context menu ===== */
    .startmenu, .ctx {
      position: absolute; z-index: 700; display: none; padding: 10px; border-radius: 16px;
      background: rgba(24,26,32,.94); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,.1);
      box-shadow: 0 30px 60px -10px rgba(0,0,0,.7);
    }
    .startmenu { left: 8px; bottom: 60px; width: 380px; max-height: calc(100% - 72px); overflow: auto; }
    .startmenu.show, .ctx.show { display: block; animation: reveal .25s var(--ease, ease); }
    .ctx { min-width: 220px; padding: 6px; border-radius: 12px; }
    .sm-user { display: flex; gap: 10px; align-items: center; padding: 6px 8px 12px; border-bottom: 1px solid rgba(255,255,255,.08); margin-bottom: 8px; }
    .sm-user .av { width: 38px; height: 38px; border-radius: 50%; background: var(--text, #fff); color: #000; display: grid; place-items: center; font-family: var(--mono); font-weight: 700; font-size: 12px; flex: none; }
    .sm-user small { display: block; color: var(--muted, #8e8e93); font-size: 11px; }
    .sm-q { width: 100%; box-sizing: border-box; height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.06); color: inherit; font: inherit; outline: none; margin-bottom: 8px; }
    .sm-q:focus { border-color: rgba(10,132,255,.7); }
    .sm-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
    .sm-app { border: 0; background: transparent; border-radius: 10px; padding: 10px 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11.5px; text-align: center; }
    .sm-app b { font-size: 24px; font-weight: 400; }
    .sm-app:hover { background: rgba(255,255,255,.08); }
    .sm-empty { grid-column: 1 / -1; color: var(--muted, #8e8e93); padding: 12px 6px; font-size: 13px; }
    .sm-foot { display: flex; gap: 4px; border-top: 1px solid rgba(255,255,255,.08); margin-top: 8px; padding-top: 8px; }
    .sm-item { width: 100%; text-align: left; padding: 9px 10px; border-radius: 9px; border: 0; background: transparent; cursor: pointer; display: flex; gap: 10px; font-size: 13px; }
    .sm-foot .sm-item { justify-content: center; font-size: 12px; }
    .sm-item:hover { background: rgba(255,255,255,.08); }
    .sm-sep { height: 1px; background: rgba(255,255,255,.08); margin: 6px 0; }

    /* ===== Windows ===== */
    .win {
      position: absolute; min-width: 260px; min-height: 160px; display: flex; flex-direction: column;
      border-radius: 14px; overflow: hidden; z-index: 10;
      background: rgba(26,28,34,.94); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255,255,255,.12); box-shadow: 0 30px 70px -15px rgba(0,0,0,.75);
      animation: winIn .28s var(--ease, ease);
    }
    @keyframes winIn { from { opacity: 0; transform: scale(.94); } }
    .win.min { display: none; }
    .win.max { left: 6px !important; top: 6px !important; width: calc(100% - 12px) !important; height: calc(100% - 64px) !important; }
    .win.focus { border-color: rgba(255,255,255,.22); }
    .wbar { height: 40px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: rgba(255,255,255,.04); border-bottom: 1px solid rgba(255,255,255,.07); cursor: grab; touch-action: none; }
    .wbar:active { cursor: grabbing; }
    .dots { display: flex; gap: 7px; }
    .dots button { width: 13px; height: 13px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; }
    .dots .c { background: #ff5f57; } .dots .m { background: #febc2e; } .dots .x { background: #28c840; }
    .wtitle { flex: 1; text-align: center; font-size: 13px; color: #c9ced6; font-weight: 500; margin-right: 50px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wbody { flex: 1; min-height: 0; overflow: auto; padding: 16px; user-select: text; -webkit-user-select: text; }
    .wbody.flush { padding: 0; }
    .rsz { position: absolute; right: 0; bottom: 0; width: 18px; height: 18px; cursor: nwse-resize; touch-action: none; }
    .win.max .rsz { display: none; }
    .wbody textarea { width: 100%; height: 100%; min-height: 180px; resize: none; border: 0; outline: none; background: transparent; color: inherit; font: 14px/1.6 var(--mono); box-sizing: border-box; }

    /* ===== Common bits ===== */
    .row-list { display: grid; gap: 2px; align-content: start; }
    .row { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 9px; cursor: pointer; min-width: 0; }
    .row > span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .row:hover { background: rgba(255,255,255,.07); }
    .row.on { background: rgba(10,132,255,.28); }
    .row .g { font-size: 20px; flex: none; }
    .wbody .row, .wbody .mrow, .sweep, .cal-grid, .calc, .ptools, .tm { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    .row small { color: var(--muted, #8e8e93); }
    .crumbs { font-family: var(--mono); font-size: 11.5px; color: var(--muted, #8e8e93); word-break: break-all; }
    .muted { color: var(--muted, #8e8e93); }
    .about dt { color: var(--muted, #8e8e93); font-size: 12px; font-family: var(--mono); margin-top: 8px; }
    .about dd { margin: 0; }
    .dlg { text-align: center; padding: 6px; }
    .dlg .big { font-size: 42px; }
    .dlg p { color: #cfd3da; line-height: 1.5; }
    .btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
    .tb { border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.06); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 12.5px; white-space: nowrap; }
    .tb:hover { background: rgba(255,255,255,.12); }
    .tb:disabled { opacity: .4; cursor: not-allowed; }
    .ib { border: 0; background: rgba(255,255,255,.06); border-radius: 8px; width: 32px; height: 32px; cursor: pointer; flex: none; }
    .ask label { display: block; font-size: 12px; color: var(--muted, #8e8e93); margin-bottom: 6px; }
    .ask input, .fld { width: 100%; box-sizing: border-box; height: 38px; padding: 0 12px; border-radius: 9px; border: 1px solid rgba(255,255,255,.14); background: rgba(0,0,0,.25); color: inherit; font: inherit; outline: none; }
    .bar { height: 8px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden; margin: 10px 0; }
    .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #0a84ff, #bf5af2); transition: width .2s; }
    .card { border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.04); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
    .props { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; font-size: 13px; }
    .props dt { color: var(--muted, #8e8e93); font-family: var(--mono); font-size: 11.5px; padding-top: 2px; }
    .props dd { margin: 0; word-break: break-word; }
    .hl { color: #ffd60a; font-family: var(--mono); }

    /* ===== Notifications ===== */
    .notes { position: absolute; top: 10px; right: 10px; z-index: 800; display: grid; gap: 8px; width: min(320px, calc(100% - 20px)); pointer-events: none; }
    .note { pointer-events: auto; display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; cursor: pointer;
      background: rgba(30,32,40,.92); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 18px 40px -12px rgba(0,0,0,.7); animation: noteIn .35s var(--ease, ease); transition: opacity .35s, transform .35s; }
    .note.out { opacity: 0; transform: translateX(20px); }
    .note .g { font-size: 22px; line-height: 1; }
    .note b { display: block; font-size: 13px; }
    .note small { display: block; color: #c4c8cf; font-size: 12px; margin-top: 2px; line-height: 1.4; }
    @keyframes noteIn { from { opacity: 0; transform: translateY(-10px); } }

    /* ===== Explorer ===== */
    .xp { display: flex; height: 100%; }
    .xp-side { width: 150px; flex: none; padding: 10px 6px; border-right: 1px solid rgba(255,255,255,.07); overflow: auto; }
    .xp-side .row { padding: 7px 8px; font-size: 13px; }
    .xp-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .xp-bar { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,.07); }
    .xp-bar .crumbs { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .xp-q { width: 140px; height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,.1); background: rgba(0,0,0,.2); color: inherit; font: inherit; outline: none; }
    .xp-tools { display: flex; gap: 6px; padding: 8px 10px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid rgba(255,255,255,.05); }
    .xp-list { flex: 1; overflow: auto; padding: 8px; }
    .xp-status { padding: 6px 12px; font-size: 11.5px; color: var(--muted, #8e8e93); border-top: 1px solid rgba(255,255,255,.07); font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ===== Docs / images ===== */
    .doc-tools { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
    .paper { background: #f5f5f0; color: #1d1d1f; border-radius: 6px; padding: 26px 28px; min-height: 70%; font: 14px/1.7 Georgia, serif; box-shadow: 0 10px 30px rgba(0,0,0,.4); white-space: normal; word-break: break-word; }
    .imgv { text-align: center; padding: 10px; }
    .imgv .pic { font-size: 110px; line-height: 1.2; padding: 20px; border-radius: 14px; background: repeating-conic-gradient(rgba(255,255,255,.04) 0 25%, transparent 0 50%) 0 0 / 20px 20px; }

    /* ===== Terminal ===== */
    .term { background: #050607; font: 13px/1.6 var(--mono); color: #c9f7c9; min-height: 100%; padding: 12px; box-sizing: border-box; white-space: pre-wrap; word-break: break-word; }
    .term .in-row { display: flex; gap: 6px; }
    .term input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: inherit; font: inherit; padding: 0; }
    .term .err { color: #ff6961; } .term .dim { color: #6c7a6c; } .term .y { color: #ffd60a; }

    /* ===== Mail ===== */
    .mail { display: grid; grid-template-columns: 250px 1fr; height: 100%; }
    .mail-list { border-right: 1px solid rgba(255,255,255,.07); overflow: auto; }
    .mrow { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,.05); cursor: pointer; display: grid; gap: 2px; font-size: 13px; }
    .mrow span { color: #c4c8cf; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mrow small { color: var(--muted, #8e8e93); font-size: 11px; }
    .mrow b { font-weight: 500; }
    .mrow.unread b { font-weight: 700; } .mrow.unread { box-shadow: inset 3px 0 #0a84ff; }
    .mrow.on, .mrow:hover { background: rgba(255,255,255,.06); }
    .mail-view { overflow: auto; padding: 18px; }
    .mail-view h3 { margin: 0 0 6px; font-size: 18px; letter-spacing: -.01em; }
    .mfrom { color: var(--muted, #8e8e93); font-size: 12px; margin-bottom: 16px; }
    .mbody { line-height: 1.6; color: #dfe2e7; }
    .mail .back { display: none; margin-bottom: 12px; }
    .att { margin-top: 14px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.05); border-radius: 10px; padding: 10px 14px; cursor: pointer; }
    .empty { color: var(--muted, #8e8e93); padding: 30px 10px; text-align: center; }

    /* ===== Browser ===== */
    .br { display: flex; flex-direction: column; height: 100%; }
    .br-bar { display: flex; gap: 6px; padding: 8px; border-bottom: 1px solid rgba(255,255,255,.07); }
    .br-bar form { flex: 1; min-width: 0; }
    .br-bar input { width: 100%; box-sizing: border-box; height: 32px; border-radius: 16px; border: 1px solid rgba(255,255,255,.1); background: rgba(0,0,0,.25); color: inherit; padding: 0 14px; font: 13px var(--mono); outline: none; }
    .br-page { flex: 1; overflow: auto; background: #fbfbfd; color: #1d1d1f; padding: 22px; }
    .br-page a, .br-page [data-href] { color: #0066cc; cursor: pointer; text-decoration: underline; }
    .br-page h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -.02em; }
    .br-page .sr { margin: 14px 0; }
    .br-page .sr small { display: block; color: #1a7f37; font-family: var(--mono); font-size: 11px; }
    .br-page .post { border-bottom: 1px solid #e3e3e8; padding: 12px 0; }
    .br-page .post b { color: #6e36c9; }
    .br-page .prod { display: flex; justify-content: space-between; gap: 10px; align-items: center; border: 1px solid #e3e3e8; border-radius: 12px; padding: 12px 14px; margin: 10px 0; }
    .br-page button { border: 0; border-radius: 999px; padding: 7px 14px; background: #0071e3; color: #fff; cursor: pointer; }
    .br-page button:disabled { background: #b8b8bd; }
    .br-page .sbox { display: flex; gap: 8px; max-width: 460px; margin: 18px auto; }
    .br-page .sbox input { flex: 1; min-width: 0; height: 42px; border-radius: 21px; border: 1px solid #d2d2d7; padding: 0 16px; font: inherit; color: #1d1d1f; }
    .br-page .tiles { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .br-page .tiles span { padding: 10px 14px; border-radius: 12px; background: #f0f0f5; text-decoration: none; }
    .br-page .bar { background: #e3e3e8; }

    /* ===== Printer / chat / task manager ===== */
    .printer-hero { display: flex; gap: 14px; align-items: center; }
    .printer-hero .pg { font-size: 54px; }
    .page-out { margin: 14px auto 0; width: 200px; min-height: 240px; background: #fff; color: #111; border-radius: 4px; padding: 18px; font: 13px/1.5 Georgia, serif; text-align: center; display: grid; place-items: center; box-shadow: 0 10px 30px rgba(0,0,0,.4); animation: feed 1.4s var(--ease, ease); }
    @keyframes feed { from { transform: translateY(-60px); opacity: 0; clip-path: inset(0 0 100% 0); } }
    .chat { display: flex; flex-direction: column; height: 100%; }
    .chat-log { flex: 1; overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
    .bub { max-width: 80%; padding: 9px 13px; border-radius: 16px; line-height: 1.45; font-size: 13.5px; }
    .bub.them { background: rgba(255,255,255,.08); align-self: flex-start; border-bottom-left-radius: 4px; }
    .bub.me { background: #0a84ff; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .chat form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid rgba(255,255,255,.07); }
    .chat input { flex: 1; min-width: 0; }
    .tm { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .tm th { text-align: left; color: var(--muted, #8e8e93); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid rgba(255,255,255,.08); position: sticky; top: 0; background: rgba(26,28,34,.98); }
    .tm td { padding: 7px 8px; border-bottom: 1px solid rgba(255,255,255,.04); white-space: nowrap; }
    .tm td:first-child { white-space: normal; }
    .tm tr { cursor: pointer; } .tm tr.on td { background: rgba(10,132,255,.25); }
    .tm small { display: block; color: var(--muted, #8e8e93); font-size: 11px; }

    /* ===== Calculator / paint / calendar / music / sweeper ===== */
    .calc { display: flex; flex-direction: column; height: 100%; gap: 10px; }
    .calc-disp { font: 300 40px/1.1 var(--mono); text-align: right; padding: 10px 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .calc-keys { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .ck { border: 0; border-radius: 14px; background: rgba(255,255,255,.1); font-size: 20px; cursor: pointer; min-height: 48px; }
    .ck.op { background: #ff9f0a; color: #fff; } .ck.zero { grid-column: span 2; }
    .ck:active { filter: brightness(1.4); }
    .sw { display: inline-flex; gap: 8px; align-items: center; font-size: 12.5px; cursor: pointer; }
    .paint { display: flex; flex-direction: column; height: 100%; }
    .ptools { display: flex; gap: 6px; padding: 8px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid rgba(255,255,255,.07); }
    .sw-c { width: 24px; height: 24px; border-radius: 50%; border: 2px solid rgba(255,255,255,.2); cursor: pointer; padding: 0; }
    .sw-c.on, .tb.on { outline: 2px solid #0a84ff; outline-offset: 1px; }
    .pwrap { flex: 1; min-height: 0; position: relative; background: #fff; }
    .pwrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-grid .h { text-align: center; font-size: 11px; color: var(--muted, #8e8e93); padding: 4px 0; }
    .cal-d { aspect-ratio: 1; border: 0; border-radius: 10px; background: rgba(255,255,255,.04); cursor: pointer; position: relative; font-size: 13px; }
    .cal-d.today { background: #0a84ff; color: #fff; }
    .cal-d.sel { outline: 2px solid #bf5af2; }
    .cal-d i { position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: #ff9f0a; }
    .cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .np { display: flex; gap: 14px; align-items: center; }
    .art { width: 84px; height: 84px; flex: none; border-radius: 14px; display: grid; place-items: center; font-size: 40px; background: linear-gradient(135deg, #bf5af2, #0a84ff); }
    .viz { display: flex; gap: 3px; align-items: flex-end; height: 34px; margin: 12px 0; }
    .viz i { flex: 1; background: rgba(255,255,255,.25); height: 10%; border-radius: 2px; }
    .playing .viz i { animation: viz .5s ease-in-out infinite alternate; }
    .viz i:nth-child(3n) { animation-delay: -.2s !important; } .viz i:nth-child(4n) { animation-delay: -.35s !important; }
    @keyframes viz { from { height: 10%; } to { height: 100%; } }
    .controls { display: flex; gap: 8px; justify-content: center; }
    .controls button { width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,.1); cursor: pointer; font-size: 16px; }
    .sweep { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; max-width: 360px; margin: 0 auto; }
    .sc { aspect-ratio: 1; border: 0; border-radius: 6px; background: rgba(255,255,255,.14); cursor: pointer; font: 600 14px var(--mono); padding: 0; }
    .sc.open { background: rgba(255,255,255,.04); cursor: default; }
    .sc.boom { background: #ff453a; }
    .disc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .disc { border-radius: 12px; padding: 12px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.06); font-size: 12.5px; }
    .disc .g { font-size: 24px; }
    .disc.lock { opacity: .55; }
    .disc small { display: block; color: var(--muted, #8e8e93); margin-top: 4px; line-height: 1.35; }
    .set-sec { margin-bottom: 18px; }
    .set-sec h4 { margin: 0 0 8px; font-size: 12px; color: var(--muted, #8e8e93); font-weight: 500; text-transform: uppercase; letter-spacing: .06em; }
    .set-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
    .walls { display: flex; gap: 8px; flex-wrap: wrap; }
    .walls button { width: 54px; height: 38px; border-radius: 9px; border: 2px solid transparent; cursor: pointer; }
    .walls button.on { border-color: #fff; }
    .seg { display: inline-flex; background: rgba(255,255,255,.06); border-radius: 9px; padding: 2px; }
    .seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; cursor: pointer; font-size: 12.5px; }
    .seg button.on { background: rgba(255,255,255,.18); }

    /* ===== Crash / boot / off / saver / pet ===== */
    .crash { position: absolute; inset: 0; z-index: 900; display: none; padding: clamp(24px, 6vw, 70px); background: #0067c0; color: #fff; overflow: auto; }
    .crash.show { display: block; }
    .crash .face { font-size: clamp(70px, 14vw, 130px); line-height: 1; font-weight: 300; }
    .crash p { font-size: clamp(16px, 2.4vw, 22px); max-width: 640px; line-height: 1.45; }
    .crash small { display: block; margin-top: 26px; opacity: .85; font-size: 13px; }
    .boot, .off { position: absolute; inset: 0; z-index: 950; display: none; place-items: center; background: #000; text-align: center; padding: 20px; }
    .boot.show, .off.show { display: grid; }
    .boot .spinner { width: 34px; height: 34px; margin: 26px auto 0; border-radius: 50%; border: 3px solid rgba(255,255,255,.15); border-top-color: #fff; animation: spin 1s linear infinite; }
    .boot .bl { margin-top: 16px; font: 12px var(--mono); color: #8e8e93; min-height: 18px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .off p { color: #555; font: 12px var(--mono); }
    .off button { margin-top: 20px; border: 1px solid #222; background: transparent; color: #444; border-radius: 999px; padding: 6px 14px; cursor: pointer; opacity: 0; animation: fadein 1s 3s forwards; }
    @keyframes fadein { to { opacity: 1; } }
    .saver { position: absolute; inset: 0; z-index: 940; background: #000; display: none; }
    .saver.show { display: block; }
    .saver .logo { position: absolute; padding: 10px 16px; border-radius: 12px; font-weight: 700; letter-spacing: -.02em; color: #000; background: #0a84ff; white-space: nowrap; }
    .pet { position: absolute; bottom: 52px; left: 40%; z-index: 450; font-size: 30px; cursor: pointer; transition: left 6s linear; user-select: none; }
    .pet.flip > b { display: inline-block; transform: scaleX(-1); }
    .pet b { font-weight: 400; }
    .pet .say { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); width: max-content; max-width: 220px; background: #fff; color: #111; font-size: 12px; line-height: 1.4; padding: 8px 10px; border-radius: 12px; display: none; text-align: left; }
    .pet .say.show { display: block; animation: reveal .25s; }
    .pet.hide { display: none; }

    /* ===== Touch & mobile ===== */
    @media (pointer: coarse) {
      .row, .mrow { min-height: 44px; }
      .dots button { width: 18px; height: 18px; }
      .dots { gap: 12px; }
      .tb { padding: 8px 12px; }
    }
    @media (max-width: 700px) {
      .os { height: calc(100dvh - 170px); min-height: 520px; border-radius: 16px; }
      .os.full { height: 100dvh; }
      .desk { grid-auto-flow: row; grid-template-columns: repeat(4, 1fr); grid-template-rows: none; grid-auto-rows: 92px; grid-auto-columns: auto; overflow-y: auto; padding: 12px 8px; }
      .win { left: 6px !important; top: 6px !important; width: calc(100% - 12px) !important; height: calc(100% - 64px) !important; }
      .win.modal { top: 14% !important; height: auto !important; max-height: calc(100% - 120px); }
      .rsz { display: none; }
      .wbar { cursor: default; height: 46px; }
      .wtitle { margin-right: 0; }
      .clock .d, .tray .opt { display: none; }
      .start { padding: 0 12px; }
      .startmenu { left: 6px; right: 6px; width: auto; }
      .sm-grid { grid-template-columns: repeat(4, 1fr); }
      .xp-side { display: none; }
      .xp-q { width: 96px; }
      .mail { grid-template-columns: 1fr; }
      .mail .mail-view { display: none; }
      .mail.reading .mail-list { display: none; }
      .mail.reading .mail-view { display: block; }
      .mail .back { display: inline-block; }
      .props { grid-template-columns: 90px 1fr; }
      .br-page { padding: 16px; }
      .notes { left: 10px; right: 10px; width: auto; }
      /* prevent iOS zoom on focus */
      .term input, .sm-q, .xp-q, .ask input, .fld, .br-bar input, .br-page input, .wbody textarea { font-size: 16px; }
      .pet { font-size: 26px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .os * { animation-duration: .001s !important; transition-duration: .001s !important; }
    }
