<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Laboratory OS — Animesh Kherwar's Lab</title>
  <meta name="theme-color" content="#08090a">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">
  <link rel="stylesheet" href="../../assets/css/lab.css">
  <style>
    .os {
      position: relative; height: min(74vh, 680px); min-height: 520px; border-radius: 22px; overflow: hidden;
      border: 1px solid var(--line-2); user-select: none; -webkit-user-select: none;
      background:
        radial-gradient(60% 80% at 15% 20%, rgba(10,132,255,.55), transparent 60%),
        radial-gradient(50% 70% at 85% 30%, rgba(191,90,242,.45), transparent 60%),
        radial-gradient(70% 60% at 50% 100%, rgba(48,209,88,.35), transparent 60%),
        #0b0d12;
      font-size: 14px;
    }
    .desk { position: absolute; inset: 0 0 52px 0; padding: 16px; display: grid; grid-auto-flow: column; grid-template-rows: repeat(auto-fill, 96px); grid-auto-columns: 92px; gap: 6px; align-content: start; }
    .ico { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 4px; border-radius: 12px; cursor: default; text-align: center; border: 1px solid transparent; }
    .ico .g { font-size: 34px; line-height: 1; filter: drop-shadow(0 6px 10px rgba(0,0,0,.4)); }
    .ico span { font-size: 12px; line-height: 1.2; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
    .ico:hover { background: rgba(255,255,255,.08); }
    .ico.sel { background: rgba(10,132,255,.3); border-color: rgba(10,132,255,.6); }
    .taskbar {
      position: absolute; left: 0; right: 0; bottom: 0; height: 52px; z-index: 500;
      display: flex; align-items: center; gap: 6px; padding: 0 8px;
      background: rgba(18,20,26,.72); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6);
      border-top: 1px solid rgba(255,255,255,.08);
    }
    .start { height: 38px; padding: 0 14px; border-radius: 10px; border: 0; background: rgba(255,255,255,.08); cursor: pointer; font-weight: 600; display: flex; gap: 8px; align-items: center; }
    .start:hover, .start.on { background: rgba(255,255,255,.16); }
    .tasks { flex: 1; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
    .task { height: 38px; max-width: 170px; padding: 0 12px; border-radius: 10px; border: 0; background: rgba(255,255,255,.05); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; border-bottom: 2px solid transparent; }
    .task.active { background: rgba(255,255,255,.14); border-bottom-color: var(--exp); }
    .clock { font-family: var(--mono); font-size: 12px; color: #cfd3da; padding: 0 8px; text-align: right; line-height: 1.3; }
    .startmenu {
      position: absolute; left: 8px; bottom: 60px; z-index: 600; width: 270px; padding: 10px; border-radius: 16px; display: none;
      background: rgba(24,26,32,.9); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,.1);
      box-shadow: 0 30px 60px -10px rgba(0,0,0,.7);
    }
    .startmenu.show { display: block; animation: reveal .3s var(--ease); }
    .sm-user { display: flex; gap: 10px; align-items: center; padding: 8px 8px 12px; border-bottom: 1px solid rgba(255,255,255,.08); margin-bottom: 6px; }
    .sm-user .av { width: 36px; height: 36px; border-radius: 50%; background: var(--text); color: #000; display: grid; place-items: center; font-family: var(--mono); font-weight: 700; font-size: 12px; }
    .sm-user small { display: block; color: var(--muted); font-size: 11px; }
    .sm-item { width: 100%; text-align: left; padding: 9px 10px; border-radius: 9px; border: 0; background: transparent; cursor: pointer; display: flex; gap: 10px; }
    .sm-item:hover { background: rgba(255,255,255,.08); }
    .sm-sep { height: 1px; background: rgba(255,255,255,.08); margin: 6px 0; }

    .win {
      position: absolute; min-width: 260px; display: flex; flex-direction: column;
      border-radius: 14px; overflow: hidden; z-index: 10;
      background: rgba(26,28,34,.92); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255,255,255,.12); box-shadow: 0 30px 70px -15px rgba(0,0,0,.75);
      animation: winIn .28s var(--ease);
    }
    @keyframes winIn { from { opacity: 0; transform: scale(.94); } }
    .win.min { display: none; }
    .win.max { left: 6px !important; top: 6px !important; width: calc(100% - 12px) !important; height: calc(100% - 64px) !important; }
    .win.focus { border-color: rgba(255,255,255,.22); }
    .wbar { height: 40px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: rgba(255,255,255,.04); border-bottom: 1px solid rgba(255,255,255,.07); cursor: grab; touch-action: none; }
    .wbar:active { cursor: grabbing; }
    .dots { display: flex; gap: 7px; }
    .dots button { width: 13px; height: 13px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; }
    .dots .c { background: #ff5f57; } .dots .m { background: #febc2e; } .dots .x { background: #28c840; }
    .wtitle { flex: 1; text-align: center; font-size: 13px; color: #c9ced6; font-weight: 500; margin-right: 50px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wbody { flex: 1; overflow: auto; padding: 16px; user-select: text; -webkit-user-select: text; }
    .wbody textarea { width: 100%; height: 100%; min-height: 180px; resize: none; border: 0; outline: none; background: transparent; color: var(--text); font: 14px/1.6 var(--mono); }
    .row-list { display: grid; gap: 4px; }
    .row { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 9px; cursor: pointer; }
    .row:hover { background: rgba(255,255,255,.07); }
    .row .g { font-size: 20px; }
    .crumbs { font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-bottom: 10px; word-break: break-all; }
    .about dt { color: var(--muted); font-size: 12px; font-family: var(--mono); margin-top: 8px; }
    .about dd { margin: 0; }
    .term { background: #050607; font: 13px/1.6 var(--mono); color: #c9f7c9; min-height: 100%; padding: 12px; border-radius: 8px; }
    .term input { background: transparent; border: 0; outline: none; color: inherit; font: inherit; width: 70%; }
    .dlg { text-align: center; padding: 6px; }
    .dlg .big { font-size: 42px; }
    .dlg p { color: #cfd3da; }
    .dlg .btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }

    .crash { position: absolute; inset: 0; z-index: 900; display: none; padding: clamp(24px, 6vw, 70px); background: #0067c0; color: #fff; }
    .crash.show { display: block; }
    .crash .face { font-size: clamp(70px, 14vw, 130px); line-height: 1; font-weight: 300; }
    .crash p { font-size: clamp(16px, 2.4vw, 22px); max-width: 640px; line-height: 1.45; }
    .crash small { display: block; margin-top: 26px; opacity: .85; font-size: 13px; }
    .boot { position: absolute; inset: 0; z-index: 950; display: none; place-items: center; background: #000; text-align: center; }
    .boot.show { display: grid; }
    .boot .spinner { width: 34px; height: 34px; margin: 26px auto 0; border-radius: 50%; border: 3px solid rgba(255,255,255,.15); border-top-color: #fff; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 700px) {
      .os { height: calc(100dvh - 190px); min-height: 480px; }
      .desk { grid-auto-flow: row; grid-template-columns: repeat(4, 1fr); grid-template-rows: none; grid-auto-rows: 92px; grid-auto-columns: auto; }
      .win { left: 6px !important; top: 6px !important; width: calc(100% - 12px) !important; height: calc(100% - 64px) !important; }
      .wbar { cursor: default; }
      .clock .d { display: none; }
      .wtitle { margin-right: 0; }
    }
  </style>
</head>
<body data-root="../../" data-exp="007">
  <div data-lab-header></div>
  <section data-lab-hero></section>

  <main class="wrap">
    <div class="os" id="os">
      <div class="desk" id="desk"></div>
      <div class="startmenu" id="startmenu">
        <div class="sm-user"><div class="av">AK</div><div>Animesh Kherwar<small>Administrator of nothing</small></div></div>
        <button class="sm-item" data-open="experiments">🧪 Experiments</button>
        <button class="sm-item" data-open="notes">📄 Notes.txt</button>
        <button class="sm-item" data-open="terminal">💻 Terminal</button>
        <button class="sm-item" data-open="about">ℹ️ About This Lab</button>
        <div class="sm-sep"></div>
        <button class="sm-item" data-sys="restart">🔁 Restart</button>
        <button class="sm-item" data-sys="shutdown">⏻ Shut down</button>
      </div>
      <div class="taskbar">
        <button class="start" id="start">◎ Lab</button>
        <div class="tasks" id="tasks"></div>
        <div class="clock" id="clock"></div>
      </div>
      <div class="crash" id="crash">
        <div class="face">:(</div>
        <p>Laboratory OS ran into a problem because you opened a folder labelled <b>DO NOT OPEN</b>. We're collecting some error info, and then we'll judge you.</p>
        <p><span id="crashPct">0</span>% complete</p>
        <small>Stop code: USER_IGNORED_EXPLICIT_INSTRUCTIONS<br>What failed: common_sense.sys</small>
      </div>
      <div class="boot" id="boot"><div><div style="font-size:46px">🧪</div><div style="margin-top:10px;font-weight:600;letter-spacing:-.02em">Laboratory OS</div><div class="spinner"></div></div></div>
    </div>
  </main>

  <nav data-lab-pager></nav>

  <script src="../../assets/js/registry.js"></script>
  <script src="../../assets/js/lab.js"></script>
  <script src="app.js"></script>
</body>
</html>
